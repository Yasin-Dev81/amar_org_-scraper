[project]
name = "amar-org"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yasin Khosh manesh", email = "eayeay33@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "filetype>=1.2.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.2",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
amar-org = "amar_org:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

